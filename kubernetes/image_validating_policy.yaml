apiVersion: policies.kyverno.io/v1
kind: ImageValidatingPolicy
metadata:
  name: verify-ecr-images

spec:
  failurePolicy: Fail

  webhookConfiguration:
    timeoutSeconds: 30

  evaluation:
    background:
      enabled: false

  validationActions:
    - Deny

  # Ensure a Deployment is rejected immediately at admission,
  # rather than only checking the Pod subsequently created by it.
  autogen:
    podControllers:
      controllers:
        - deployments
        # - statefulsets
        # - daemonsets
        # - jobs
        # - cronjobs
        # - replicasets

  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
          - UPDATE
        resources:
          - pods

  matchConditions:
    # Equivalent to namespaces: [default]
    # - name: default-namespace
    #   expression: object.metadata.namespace == "default"
    - name: exclude-system-namespaces
      expression: >-
        !(object.metadata.namespace in [
          "kyverno",
          "kube-system"
        ])

  matchImageReferences:
    - glob: "717240872783.dkr.ecr.ap-southeast-1.amazonaws.com/simple-python-app*"

  # Read the existing Kubernetes Secret.
  variables:
    - name: cosignKeySecret
      expression: >-
        resource.Get("v1", "secrets", "kyverno", "cosign-public-key")
    # Secret.data values are base64 encoded, so decode cosign.pub
    # before passing it to the Cosign verifier.
    - name: cosignPublicKey
      expression: >-
        string(
          base64.decode(
            variables.cosignKeySecret.data["cosign.pub"]
          )
        )

  # Use the Kyverno admission controller's AWS credentials
  # (EKS Pod Identity or IRSA) to authenticate against ECR.
  credentials:
    providers:
      - amazon

  attestors:
    - name: cosign
      cosign:
        key:
          expression: variables.cosignPublicKey
        ctlog:
          insecureIgnoreTlog: true

  validationConfigurations:
    required: true
    mutateDigest: true
    verifyDigest: true

  validations:
    - expression: >-
        images.containers
          .filter(image,
            image.startsWith(
              "717240872783.dkr.ecr.ap-southeast-1.amazonaws.com/simple-python-app"
            )
          )
          .map(image,
            verifyImageSignatures(
              image,
              [attestors.cosign]
            )
          )
          .all(result, result > 0)

      message: >-
        Image must have a valid Cosign signature